function closeManual(){$('manualPanel').hidden=true;$('manualLabel').setAttribute('aria-expanded','false');selected=null;if(marker){marker.remove();marker=null}$('manualSave').disabled=true}
function done(p){store(p);closeManual();$('save').disabled=false;if(!$('status').textContent.includes('sesión')&&!$('status').textContent.includes('Saio honetan'))show('home')}
function fallback(){ $('status').textContent=msg('Aukeratu elkargunea mapan.','Elige el punto de encuentro en el mapa.');openManual()}
$('manualLabel').onclick=()=>{$('status').textContent='';openManual()};$('save').onclick=()=>{const request=++gpsRequest;if(!navigator.geolocation){fallback();return}$('save').disabled=true;$('status').textContent=T[lang].loading;navigator.geolocation.getCurrentPosition(p=>{if(request!==gpsRequest)return;if(p.coords.accuracy>50){fallback();return}done([p.coords.latitude,p.coords.longitude])},()=>{if(request===gpsRequest)fallback()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};$('manualSave').onclick=()=>{if(!selected||!tilesOkay)return;++gpsRequest;done(selected)};
$('clear').onclick=()=>{++gpsRequest;point=null;try{localStorage.removeItem('azoka61-meeting')}catch{}status()};update();</script></body></html>
